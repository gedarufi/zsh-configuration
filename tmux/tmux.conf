source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g mouse on
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty*:RGB"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=#bb9af7,bg=default'
set -g pane-border-style 'fg=#414868,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'gedarufi/tmux2k'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# sessionx
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# resurrect / continuum
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux2k — Tokyo Storm
set -g @tmux2k-theme 'default'
set -g @tmux2k-bg-main '#1e1e2e'
set -g @tmux2k-text '#c0caf5'

# Color palette
set -g @tmux2k-black '#1a1b26'
set -g @tmux2k-dark-gray '#3f3f4f'
set -g @tmux2k-white '#c0caf5'
set -g @tmux2k-purple '#bb9af7'
set -g @tmux2k-blue '#7aa2f7'
set -g @tmux2k-light-blue '#7dcfff'
set -g @tmux2k-green '#9ece6a'
set -g @tmux2k-light-green '#73daca'
set -g @tmux2k-yellow '#e0af68'
set -g @tmux2k-red '#f7768e'
set -g @tmux2k-orange '#ff9e64'

# Fix empty-key associative array bug (prevents red cap)
set -g @tmux2k--colors "bg_main text"

# Plugin layout
set -g @tmux2k-left-plugins "session path git"
set -g @tmux2k-right-plugins "battery cpu gpu ram langs time"

# Plugin colors
set -g @tmux2k-session-colors "light_blue black"
set -g @tmux2k-langs-colors "gray white"
set -g @tmux2k-path-colors "gray light_blue"
set -g @tmux2k-git-colors "purple black"
set -g @tmux2k-cpu-colors "purple black"
set -g @tmux2k-gpu-colors "light_blue black"
set -g @tmux2k-ram-colors "blue black"
set -g @tmux2k-battery-colors "green black"
set -g @tmux2k-time-colors "bg_main blue"

# Window list — rounded pills, centered
set -g @tmux2k-window-list-colors "bg_main blue"
set -g @tmux2k-window-list-alignment 'centre'
set -g @tmux2k-window-list-flags 'false'
set -g @tmux2k-window-list-format '#I #W'
set -g @tmux2k-window-list-left-sep ""
set -g @tmux2k-window-list-right-sep ""

# Separators (left/right status bars)
set -g @tmux2k-left-sep ""
set -g @tmux2k-right-sep ""

# Git + time options
set -g @tmux2k-git-display-status 'true'
set -g @tmux2k-time-format '%H:%M'
set -g @tmux2k-prefix-highlight '#f7768e'

run '~/.tmux/plugins/tpm/tpm'